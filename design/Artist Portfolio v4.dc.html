<style>
  body {
    margin: 0;
    --color-bg: #ffffff;
    --color-text: #131316;
    --color-surface: #f5f5f7;
    --color-neutral-500: #63636d;
    --color-neutral-800: #ebebef;
    --color-accent: #5a4bc4;
    --color-accent-300: #443a97;
    --shadow-sm: 0 1px 2px rgba(19,19,22,0.06), 0 2px 8px rgba(19,19,22,0.05);
    background: var(--color-bg);
  }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { color: var(--color-accent-300); }
  button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
</style>
</helmet>

<div style="font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); min-height: 100vh; font-weight: 300; overflow-x: hidden; padding-top: 60px;">

  <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding: 0 40px 84px;">
    <button style="text-align: left; display: flex; flex-direction: column; gap: 9px; padding: 26px; background: var(--color-surface); border: 1px solid transparent; border-radius: 20px; box-shadow: var(--shadow-sm); cursor: pointer; font-family: inherit; transition: transform 220ms cubic-bezier(.2,.8,.2,1), border-color 220ms ease;" style-hover="transform: translateY(-6px) rotate(-1deg); border-color: color-mix(in srgb, var(--color-accent) 45%, transparent);">
      <span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">Shop</span>
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.04em; text-transform: lowercase; color: var(--color-text);">Prints &amp; originals</span>
      <span style="font-size: 14px; line-height: 1.6; color: var(--color-neutral-500);">Riso editions, giclée prints and the odd canvas.</span>
    </button>
    <button style="text-align: left; display: flex; flex-direction: column; gap: 9px; padding: 26px; background: var(--color-surface); border: 1px solid transparent; border-radius: 20px; box-shadow: var(--shadow-sm); cursor: pointer; font-family: inherit; transition: transform 220ms cubic-bezier(.2,.8,.2,1), border-color 220ms ease;" style-hover="transform: translateY(-6px) rotate(-1deg); border-color: color-mix(in srgb, var(--color-accent) 45%, transparent);">
      <span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">About</span>
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.04em; text-transform: lowercase; color: var(--color-text);">How I work</span>
      <span style="font-size: 14px; line-height: 1.6; color: var(--color-neutral-500);">iPad first, oils when the screen gets boring.</span>
    </button>
    <button style="text-align: left; display: flex; flex-direction: column; gap: 9px; padding: 26px; background: var(--color-surface); border: 1px solid transparent; border-radius: 20px; box-shadow: var(--shadow-sm); cursor: pointer; font-family: inherit; transition: transform 220ms cubic-bezier(.2,.8,.2,1), border-color 220ms ease;" style-hover="transform: translateY(-6px) rotate(-1deg); border-color: color-mix(in srgb, var(--color-accent) 45%, transparent);">
      <span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">Contact</span>
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.04em; text-transform: lowercase; color: var(--color-text);">Commission me</span>
      <span style="font-size: 14px; line-height: 1.6; color: var(--color-neutral-500);">Characters, covers, editorial. Quote in a day.</span>
    </button>
  </section>

  <div style="padding: 70px 40px 0; overflow: hidden;">
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: clamp(72px, 17vw, 260px); font-weight: 800; line-height: 0.82; letter-spacing: -0.06em; text-transform: lowercase; color: var(--color-neutral-800); white-space: nowrap;">yurix</div>
  </div>

  <footer style="display: flex; align-items: flex-end; justify-content: space-between; gap: 36px; flex-wrap: wrap; padding: 34px 40px 48px; border-top: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);">
    <div>
      <div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-500); margin-bottom: 8px;">say hi</div>
      <div style="font-size: 13px; color: #86868f;">Mumbai, IN · hey@aditi.art</div>
    </div>
    <div style="display: flex; gap: 18px;">
      <button style="background: transparent; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--color-accent);">Home</button>
      <button style="background: transparent; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--color-accent);">Work</button>
      <button style="background: transparent; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--color-accent);">Shop</button>
      <button style="background: transparent; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--color-accent);">About</button>
      <button style="background: transparent; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--color-accent);">Contact</button>
    </div>
    <div style="font-size: 12px; color: #d9d9df;">© 2026 · all artwork mine, no tracing pls</div>
  </footer>
</div>
