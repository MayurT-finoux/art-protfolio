<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  @keyframes pf-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes pf-up { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes pf-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  html, body { margin: 0; }
  a { color: #5a4bc4; text-decoration: none; }
  a:hover { color: #443a97; }
  button:focus-visible, a:focus-visible { outline: 2px solid #5a4bc4; outline-offset: 3px; }
  [data-artboard], [data-artboard] * { cursor: none !important; }
  [data-annot="off"] [data-cname], [data-annot="off"] [data-admin] { display: none !important; }
  [data-scroller] { scrollbar-width: none; }
  [data-scroller]::-webkit-scrollbar { width: 0; height: 0; }
  @media (prefers-reduced-motion: reduce) { [data-motion] { animation: none !important; stroke-dashoffset: 0 !important; } }
</style>
</helmet>
<div data-artboard="" data-component="NotFoundPage" ref="{{ rootRef }}" data-annot="{{ annot }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position: relative; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; background-image: repeating-linear-gradient(180deg, transparent 0 39px, rgba(90,75,196,0.07) 39px 40px); font-family: 'Inter', system-ui, sans-serif; color: #131316; font-weight: 300;">
  <div data-scroller="" style="position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; container-type: inline-size;">
    <div style="position: relative; height: 100%; min-height: 360px; display: flex; flex-direction: column;">
      <span data-cname="" style="position: absolute; top: 26px; left: clamp(20px, 3.9cqw, 56px); z-index: 2; padding: 3px 7px; border-radius: 5px; background: #131316; color: #fff; font: 500 10px/1.2 'DM Mono', monospace; white-space: nowrap;">NotFoundPage</span>

      <sc-if value="{{ notL }}" hint-placeholder-val="{{ true }}">
        <section data-component="NotFoundMessage" style="position: relative; flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: clamp(12px, 1.2cqw, 18px); padding: clamp(80px, 7.2cqw, 104px) clamp(20px, 3.9cqw, 56px) clamp(8px, 1.2cqw, 18px);">
          <span style="display: flex; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #443a97;"><span data-motion="" style="width: 7px; height: 7px; border-radius: 999px; background: #5a4bc4; animation: pf-blink 1s steps(1) infinite;"></span>error 404 · page not found</span>
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(46px, 6.3cqw, 96px); line-height: 0.92; letter-spacing: -0.055em; text-wrap: balance;">oops! this page <span style="position: relative; display: inline-block; color: #5a4bc4;">ran away.<svg viewBox="0 0 300 24" preserveAspectRatio="none" style="position: absolute; left: -2%; bottom: -0.14em; width: 104%; height: 0.26em; fill: none; stroke: #131316; stroke-width: 3; stroke-linecap: round; overflow: visible; pointer-events: none;"><path data-motion="" pathLength="1" d="M4 14 C 50 4, 90 22, 140 12 S 230 4, 296 14" style="stroke-dasharray: 1; animation: pf-draw 1100ms cubic-bezier(.6,.1,.2,1) 300ms both;"></path></svg></span></h1>
          <p style="margin: 0; max-width: 520px; font-size: clamp(16px, 1.3cqw, 19px); line-height: 1.6; color: #2b2b31; text-wrap: pretty;">It's probably off chasing a deadline. Jump a few paint jars while you wait, or head home.</p>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 4px;">
            <a href="HomePage.dc.html" data-cursor="home" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; box-sizing: border-box; border-radius: 999px; background: #131316; color: #ffffff; font-size: 16px; font-weight: 600;" style-hover="background: #5a4bc4; color: #ffffff;">← back to home</a>
            <span data-admin="" style="padding: 3px 7px; border-radius: 5px; background: #fff; border: 1px dashed #5a4bc4; color: #443a97; font: 500 10px/1.2 'DM Mono', monospace;">admin · message · button label</span>
          </div>
        </section>
      </sc-if>
      <sc-if value="{{ isL }}" hint-placeholder-val="{{ false }}">
        <section data-component="NotFoundMessage" style="flex: none; height: 68px; display: flex; align-items: center; gap: 14px; padding: 0 76px 0 20px;">
          <h1 style="flex: 1 1 auto; min-width: 0; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span style="margin-right: 10px; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.1em; color: #443a97;">404</span>oops! this page <span style="color: #5a4bc4;">ran away.</span></h1>
          <a href="HomePage.dc.html" data-cursor="home" style="flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; box-sizing: border-box; border-radius: 999px; background: #131316; color: #ffffff; font-size: 14px; font-weight: 600;" style-hover="background: #5a4bc4; color: #ffffff;">← back to home</a>
        </section>
      </sc-if>

      <div style="position: relative; flex: 1 1 auto; min-height: 240px;"><dc-import name="RunnerGame Sketchbook" mobile="{{ isM }}" landscape="{{ isL }}" state="{{ state }}" at-score="{{ atScore }}" new-best="{{ newBest }}" best="{{ best }}" hit="{{ hit }}" auto-paused="{{ autoPaused }}" difficulty="{{ difficulty }}" game-on="{{ gameOn }}" asset-labels="{{ assetLabels }}" reduced="{{ reduced }}" style="position: absolute; inset: 0; display: block;" hint-size="100%,100%"></dc-import></div>
    </div>
    <dc-import name="SiteFooter" mobile="{{ isM }}" hint-size="100%,400px"></dc-import>
  </div>

  <sc-if value="{{ isD }}" hint-placeholder-val="{{ true }}">
    <nav data-component="MainNav" style="position: absolute; top: 0; left: 0; right: 0; z-index: 30; height: 84px; pointer-events: none;">
      <div style="position: relative; height: 100%; display: flex; align-items: center; justify-content: flex-end; gap: 34px; padding: 0 56px; pointer-events: auto; width: max-content; margin-left: auto;">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <button data-cursor="go" style="padding: 6px 2px; border: 0; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: -0.02em; color: #131316;" style-hover="color: #5a4bc4;">{{ n.label }}</button>
        </sc-for>
      </div>
    </nav>
  </sc-if>
  <sc-if value="{{ isM }}" hint-placeholder-val="{{ false }}">
    <nav data-component="MainNav" style="position: absolute; top: 0; right: 0; z-index: 30; height: 68px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px;">
      <button onClick="{{ openMenu }}" aria-label="Open menu" style="position: relative; width: 48px; height: 48px; border-radius: 999px; border: 0; padding: 0; background: #131316;">
        <span style="position: absolute; left: 14px; right: 14px; top: 19px; height: 2px; border-radius: 2px; background: #ffffff;"></span>
        <span style="position: absolute; left: 14px; right: 19px; top: 27px; height: 2px; border-radius: 2px; background: #ffffff;"></span>
      </button>
    </nav>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div data-component="MobileMenu" style="position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; padding: 0 12px 28px 20px; box-sizing: border-box; overflow-y: auto; background-color: #ffffff; background-image: repeating-linear-gradient(180deg, transparent 0 39px, rgba(90,75,196,0.14) 39px 40px);">
        <div style="display: flex; justify-content: flex-end; align-items: center; height: 68px; flex: none;">
          <button onClick="{{ closeMenu }}" aria-label="Close menu" style="position: relative; width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(19,19,22,0.18); padding: 0; background: #ffffff;">
            <span style="position: absolute; left: 14px; right: 14px; top: 22px; height: 2px; border-radius: 2px; background: #131316; transform: rotate(45deg);"></span>
            <span style="position: absolute; left: 14px; right: 14px; top: 22px; height: 2px; border-radius: 2px; background: #131316; transform: rotate(-45deg);"></span>
          </button>
        </div>
        <nav style="display: flex; flex-direction: column; gap: 2px; margin-top: 48px; padding-right: 8px;">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
            <button onClick="{{ closeMenu }}" data-motion="" style="display: flex; align-items: baseline; justify-content: space-between; min-height: 72px; padding: 0; border: 0; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 60px; font-weight: 800; letter-spacing: -0.055em; line-height: 1; color: #131316; animation: pf-up 460ms cubic-bezier(.2,.8,.2,1) {{ n.delay }} both;">{{ n.label }}<span style="font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 0; color: #86868f;">{{ n.num }}</span></button>
          </sc-for>
        </nav>
      </div>
    </sc-if>
  </sc-if>

  <div ref="{{ cursorRef }}" style="position: absolute; left: 0; top: 0; z-index: 95; pointer-events: none; opacity: 0;"><div style="position: absolute; left: 0; top: 0; width: 16px; height: 16px; transform: translate(-50%,-50%); border-radius: 999px; background: #fff; mix-blend-mode: difference; display: grid; place-items: center; transition: width 220ms cubic-bezier(.2,.8,.2,1), height 220ms cubic-bezier(.2,.8,.2,1), background 220ms ease;"><span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity 160ms ease;"></span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mobile&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;landscape&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;difficulty&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;easy&quot;, &quot;normal&quot;, &quot;hard&quot;], &quot;default&quot;: &quot;normal&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Game (admin)&quot;}, &quot;gameOn&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Game (admin)&quot;}, &quot;assetLabels&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Game (admin)&quot;}, &quot;reduced&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Preview&quot;}, &quot;showAnnotations&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Preview&quot;}, &quot;state&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot;}, &quot;atScore&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}, &quot;newBest&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;best&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}, &quot;hit&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot;}, &quot;autoPaused&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;boolean&quot;}}">
const NAV = ["work", "gallery", "shop", "about", "contact"];

class Component extends DCLogic {
  state = { menu: false };
  rootRef = (n) => { this.root = n; };
  cursorRef = (n) => { this.cursor = n; };
  moveCursor(e) {
    const ab = this.root, c = this.cursor;
    if (!ab || !c) return;
    const r = ab.getBoundingClientRect();
    const sc = r.width / ab.offsetWidth || 1;
    const x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
    const t = e.target && e.target.closest ? e.target.closest("[data-cursor]") : null;
    const label = t && ab.contains(t) ? t.getAttribute("data-cursor") : "";
    c.style.opacity = "1";
    c.style.transform = "translate(" + x + "px," + y + "px)";
    const blob = c.firstElementChild, lab = blob.firstElementChild;
    if (label) { blob.style.width = blob.style.height = "84px"; blob.style.background = "#5a4bc4"; blob.style.mixBlendMode = "normal"; lab.textContent = label; lab.style.opacity = "1"; }
    else { blob.style.width = blob.style.height = "16px"; blob.style.background = "#fff"; blob.style.mixBlendMode = "difference"; lab.style.opacity = "0"; }
  }
  renderVals() {
    const p = this.props, m = !!p.mobile, land = m && !!p.landscape;
    return {
      rootRef: this.rootRef, cursorRef: this.cursorRef,
      onMove: (e) => this.moveCursor(e), onLeave: () => { if (this.cursor) this.cursor.style.opacity = "0"; },
      annot: p.showAnnotations === false ? "off" : "on",
      isD: !m, isM: m, isL: land, notL: !land,
      nav: NAV.map((l, i) => ({ label: l, num: "0" + (i + 1), delay: (60 + i * 50) + "ms" })),
      menuOpen: this.state.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),
      state: p.state || undefined, atScore: p.atScore, newBest: p.newBest, best: p.best, hit: p.hit, autoPaused: p.autoPaused,
      difficulty: p.difficulty || "normal", gameOn: p.gameOn !== false, assetLabels: !!p.assetLabels, reduced: !!p.reduced
    };
  }
}
</script>
</body>
</html>
