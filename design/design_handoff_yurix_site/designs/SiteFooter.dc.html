<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=DM+Mono:wght@400&amp;display=swap" rel="stylesheet">
</helmet>
<sc-if value="{{ isD }}" hint-placeholder-val="{{ true }}">
  <div data-component="Wordmark" style="padding: 70px 56px 0; overflow: hidden;">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 260px; font-weight: 800; line-height: 0.82; letter-spacing: -0.06em; color: #ebebef; white-space: nowrap;">yurix</div>
  </div>
  <footer data-component="Footer" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 36px; padding: 34px 56px 48px; border-top: 1px solid rgba(19,19,22,0.08); font-family: 'Inter', system-ui, sans-serif; font-weight: 300;">
    <div>
      <div style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #63636d; margin-bottom: 8px;">say hi</div>
      <div style="font-size: 13px; color: #86868f;">Mumbai, IN · hey@aditi.art</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="display: flex; gap: 18px;">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <button style="background: transparent; border: 0; padding: 0; font-family: inherit; font-size: 13px; color: #5a4bc4;">{{ l }}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 18px;">
        <sc-for list="{{ ext }}" as="e" hint-placeholder-count="3">
          <a href="#" style="font-family: 'DM Mono', monospace; font-size: 12px; color: #63636d;" style-hover="color: #5a4bc4;">{{ e }} ↗</a>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 12px; color: #86868f;">© 2026 · all artwork mine, no tracing pls</div>
  </footer>
</sc-if>
<sc-if value="{{ isM }}" hint-placeholder-val="{{ false }}">
  <div style="padding: 30px 16px 0; overflow: hidden;"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 120px; font-weight: 800; line-height: 0.82; letter-spacing: -0.06em; color: #ebebef;">yurix</div></div>
  <footer data-component="Footer" style="display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 100px; border-top: 1px solid rgba(19,19,22,0.08); font-family: 'Inter', system-ui, sans-serif; font-weight: 300;">
    <div style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #63636d;">say hi</div>
    <div style="font-size: 13px; color: #86868f;">Mumbai, IN · hey@aditi.art</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px 16px;">
      <sc-for list="{{ ext }}" as="e" hint-placeholder-count="3">
        <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-family: 'DM Mono', monospace; font-size: 13px; color: #5a4bc4;">{{ e }} ↗</a>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: #86868f;">© 2026 · all artwork mine, no tracing pls</div>
  </footer>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = !!this.props.mobile;
    return {
      isD: !m, isM: m,
      links: ["Home", "Work", "Gallery", "Shop", "About", "Contact"],
      ext: ["Instagram", "Behance", "YouTube"]
    };
  }
}
</script>
</body>
</html>
